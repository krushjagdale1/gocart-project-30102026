
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: logging
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      if [kubernetes][namespace] {
        mutate {
          add_field => {
            "source_namespace" => "%{[kubernetes][namespace]}"
          }
        }
      }
    }

    output {
      elasticsearch {
        hosts => [
          "http://elasticsearch.logging.svc.cluster.local:9200"
        ]
        index => "kubernetes-logs-%{+YYYY.MM.dd}"
        ilm_enabled => false
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
spec:
  type: ClusterIP
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      nodeSelector:
        workload: elk
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.14.3
          ports:
            - containerPort: 5044
              name: beats
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
          readinessProbe:
            tcpSocket:
              port: 5044
            initialDelaySeconds: 45
            periodSeconds: 15
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline

