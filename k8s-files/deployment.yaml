
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocart-deployment
  labels:
    app: gocart
spec:
  replicas: 2

  selector:
    matchLabels:
      app: gocart

  template:
    metadata:
      labels:
        app: gocart

    spec:
      containers:
        - name: gocart
          image: krushjagdale1/gocart-krushna:4
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: gocart-config

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

